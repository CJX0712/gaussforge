[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gaussforge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "scipy>=1.13", "scikit-learn>=1.4", "optuna>=4.0"]

[tool.setuptools.packages.find]
include = ["gaussforge*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q -W ignore::UserWarning"

[tool.ruff]
line-length = 100
